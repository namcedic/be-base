version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: be-base-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      # Bắt buộc cho mysql image
      MYSQL_ROOT_PASSWORD: admin

      # Tự tạo DB + user ngay lần chạy đầu tiên
      MYSQL_DATABASE: be-base
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - be_base_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

volumes:
  be_base_mysql_data:
